services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt_novo
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulador:
    build: ./simulador
    container_name: simulador-novo
    depends_on:
      - mqtt

  nodered:
    image: nodered/node-red
    container_name: nodered_novo
    ports:
      - "1881:1880"  # PC acessa via 1881 | Interno continua 1880
    depends_on:
      - mqtt

  influxdb:
    image: influxdb:2
    container_name: influxdb_iot
    ports:
      - "8087:8086"  # PC acessa via 8087 | Interno continua 8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: senai
      DOCKER_INFLUXDB_INIT_BUCKET: linha_producao

  grafana:
    image: grafana/grafana
    container_name: grafana_novo
    ports:
      - "3001:3000"  # PC acessa via 3001 | Interno continua 3000
    depends_on:
      - influxdb