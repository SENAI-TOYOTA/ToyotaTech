[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "venv", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "ERA"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I", "W", "UP", "RUF"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["common", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = [".", "services", "layers/common/python"]
known_first_party = ["common", "services"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
